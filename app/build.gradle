plugins {
    id 'com.android.application'
}

android {
    namespace 'com.huangguo.mobile'
    compileSdk 37

    defaultConfig {
        applicationId 'com.huangguo.mobile'
        minSdk 26
        targetSdk 36
        versionCode 30
        versionName '0.2.0'
        testInstrumentationRunner 'com.huangguo.mobile.PlaybackTestRunner'
    }

    // Install device regression tests beside the user's signed app, with separate local data.
    if (providers.gradleProperty('playbackQa').isPresent()) {
        buildTypes.debug.applicationIdSuffix = '.playbackqa'
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'junit:junit:4.13.2'
    implementation 'androidx.core:core:1.7.0'
    implementation 'com.github.parse-community.Parse-SDK-Android:parse:4.4.0'
    implementation 'org.jsoup:jsoup:1.23.2'
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.0.1'
}
