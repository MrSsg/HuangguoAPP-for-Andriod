<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>黄果短剧 · 详情页进入动画对比</title>
  <style>
    :root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#f4f0e8;background:#111517}
    *{box-sizing:border-box}button{font:inherit;cursor:pointer}body{margin:0;min-height:100vh}
    .page{max-width:1260px;margin:auto;padding:38px 24px 56px}
    .topline{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:25px}
    h1{font-size:clamp(28px,3vw,42px);line-height:1.12;letter-spacing:-.03em;margin:0 0 10px}
    .intro{color:#b4b0a9;font-size:14px;margin:0;line-height:1.6}
    .all{border:1px solid #6d6249;border-radius:12px;padding:11px 16px;background:#2a2924;color:#ffe08a;white-space:nowrap;font-weight:700}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
    .option{min-width:0;padding:17px;border:1px solid #353c3f;border-radius:22px;background:#1b2123}
    .option-head{min-height:106px}.option-index{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;margin-bottom:10px;border-radius:9px;background:#ffd45b;color:#242016;font-size:12px;font-weight:900}
    h2{font-size:20px;margin:0 0 7px;letter-spacing:-.02em}.option p{margin:0;color:#aeb4b2;font-size:12px;line-height:1.55}
    .demo{position:relative;isolation:isolate;width:min(100%,330px);aspect-ratio:9/18;margin:15px auto 14px;overflow:hidden;border:1px solid #525a5a;border-radius:35px;background:#151a1c;box-shadow:0 20px 44px #0005}
    .status{position:absolute;top:0;left:0;right:0;height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 19px;z-index:6;color:#fff;font-size:10px;font-weight:700;pointer-events:none}
    .home,.detail{position:absolute;inset:0;overflow:hidden;background:#171b1d}
    .home{padding:40px 15px 84px}.home-head{display:flex;gap:9px;align-items:center;height:39px;margin-bottom:15px}.avatar{width:38px;height:38px;display:grid;place-items:center;flex:none;border-radius:50%;background:#e7dfcb;color:#171b1d;font-size:19px}.search{height:38px;display:flex;align-items:center;gap:9px;flex:1;padding:0 12px;border-radius:13px;background:#293034;color:#aaa9a2;font-size:11px}.search-mark{width:13px;height:13px;border:2px solid #aaa9a2;border-radius:50%;position:relative}.search-mark:after{content:"";position:absolute;width:7px;height:2px;background:#aaa9a2;transform:rotate(45deg);right:-6px;bottom:-3px}
    .featured{font-size:16px;font-weight:800;margin:0 0 10px}.art{position:relative;overflow:hidden;background:radial-gradient(circle at 73% 19%,#f8c7777a 0 8%,transparent 37%),linear-gradient(140deg,#412c36 0%,#934d3c 49%,#1d2c32 100%);color:#fff}.art:before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#171b1d 1%,transparent 44%),linear-gradient(90deg,#251d2a8a,transparent 66%)}.art-kicker,.art-title,.art-mark{position:absolute;z-index:1}.art-kicker{top:18px;left:17px;padding:4px 7px;border-radius:5px;background:#302212d9;color:#ffd45b;font-size:9px;font-weight:800}.art-title{left:17px;bottom:25px;font-size:42px;font-weight:900;line-height:1.05;letter-spacing:-.05em;text-shadow:0 4px 10px #211b20aa}.art-mark{right:15px;bottom:24px;color:#eac590;font-size:10px;letter-spacing:.18em;writing-mode:vertical-rl}.home-card{display:block;width:100%;padding:0;border:0;border-radius:16px;text-align:left;background:#242b2d;color:#fff;overflow:hidden}.home-card .art{height:212px}.home-card-meta{display:flex;justify-content:space-between;align-items:center;padding:12px 13px 13px}.home-card-meta strong{font-size:14px}.home-card-meta span{font-size:10px;color:#ffd45b}.home-sub{margin:17px 0 9px;color:#f5f1e7;font-size:15px;font-weight:800}.mini-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mini-poster{height:102px;border-radius:9px;background:linear-gradient(145deg,#49423f,#7b473b 55%,#252932)}.mini-poster:nth-child(2){background:linear-gradient(145deg,#262c38,#595270,#171e2e)}.mini-poster:nth-child(3){background:linear-gradient(145deg,#785142,#c38a6a,#3c3330)}
    .dock{position:absolute;left:13px;right:13px;bottom:12px;height:58px;z-index:4;display:flex;align-items:center;justify-content:space-around;border:1px solid #596061;border-radius:22px;background:#242b2d;color:#9ca6a5;font-size:11px}.dock b{display:grid;place-items:center;width:42px;height:34px;border-radius:13px;background:#ffd45b;color:#231f18;font-size:13px}
    .detail{z-index:2;opacity:0;pointer-events:none}.detail-hero{height:355px}.detail-hero .art{height:100%}.detail-hero .art-title{bottom:25px;font-size:42px}.detail-back{position:absolute;top:48px;left:15px;z-index:3;border:0;border-radius:12px;padding:8px 11px;background:#141819b8;color:#fff;font-size:12px}.detail-copy{position:relative;margin:-31px 17px 0}.detail-copy h3{font-size:26px;margin:0 0 5px}.detail-copy .meta{margin:0 0 17px;color:#c9b179;font-size:11px}.detail-copy .synopsis{color:#aaa9a2;font-size:11px;line-height:1.65;margin:0 0 17px}.detail-play{height:40px;width:100%;border:0;border-radius:10px;background:#ffd45b;color:#241f16;font-weight:900;font-size:13px}.episode-title{font-size:16px;font-weight:800;margin:22px 0 10px}.episodes{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.episodes span{display:grid;place-items:center;height:35px;border-radius:8px;background:#293034;color:#eee;font-size:12px}.episodes span:first-child{background:#ffd45b;color:#241f16}
    .controls{display:flex;gap:8px}.replay{flex:1;min-height:42px;border:0;border-radius:11px;background:#ffd45b;color:#241f16;font-size:13px;font-weight:900}.reset{min-height:42px;border:1px solid #4c5556;border-radius:11px;background:transparent;color:#c8cdca;padding:0 13px;font-size:12px}
    .shared .detail{transition:none}.shared.is-open .detail{opacity:1;pointer-events:auto}.shared.is-opening .home-card .art{opacity:0}.shared .detail-copy{opacity:0;transform:translateY(12px)}.shared.is-open .detail-copy{animation:copy-in .27s .03s both}
    .push .detail{opacity:1;transform:translate3d(100%,0,0);transition:transform .38s cubic-bezier(.2,.8,.2,1);pointer-events:none}.push .home{transition:transform .38s cubic-bezier(.2,.8,.2,1),filter .38s ease}.push.is-open .detail{transform:translate3d(0,0,0);pointer-events:auto}.push.is-open .home{transform:translate3d(-24%,0,0);filter:brightness(.7)}
    .lift .detail{opacity:1;transform:translate3d(0,105%,0) scale(.96);transform-origin:50% 100%;border-radius:25px;transition:transform .44s cubic-bezier(.16,1,.3,1),border-radius .44s cubic-bezier(.16,1,.3,1);pointer-events:none}.lift .home{transition:transform .44s cubic-bezier(.16,1,.3,1),filter .44s ease}.lift.is-open .detail{transform:translate3d(0,0,0) scale(1);border-radius:0;pointer-events:auto}.lift.is-open .home{transform:scale(.95);filter:brightness(.62)}
    @keyframes copy-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .ghost{position:absolute;z-index:5;pointer-events:none;transform-origin:top left;will-change:transform}
    button:focus-visible{outline:2px solid #ffd45b;outline-offset:3px}
    .note{margin-top:18px;color:#aeb4b2;font-size:12px;line-height:1.6}
    @media(max-width:980px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.option:last-child{grid-column:1/-1;max-width:475px;justify-self:center;width:100%}}
    @media(max-width:620px){.page{padding:26px 15px 45px}.topline{align-items:start;flex-direction:column}.grid{grid-template-columns:1fr}.option:last-child{grid-column:auto;max-width:none}}
    @media(prefers-reduced-motion:reduce){.home,.detail,.lift .detail,.push .detail,.lift .home,.push .home{transform:none!important;transition:opacity .18s ease!important}.push .detail,.lift .detail{opacity:0}.push.is-open .detail,.lift.is-open .detail{opacity:1}.push.is-open .home,.lift.is-open .home{filter:none}.ghost{display:none}.shared.is-open .detail-copy{animation:none;opacity:1;transform:none}}
  </style>
</head>
<body>
  <div class="page">
    <div class="topline"><div><h1>详情页进入动画</h1><p class="intro">点击卡片或“播放动画”对比三种进入方式。所有内容均为动画示意。</p></div><button class="all" id="play-all" type="button">同时播放三种</button></div>
    <div class="grid">
      <section class="option"><div class="option-head"><span class="option-index">A</span><h2>封面扩展</h2><p>点击的封面长成详情首屏，作品关系最清楚 · 约 500 ms</p></div><div class="demo shared" data-variant="shared"></div><div class="controls"><button class="replay" type="button">播放动画</button><button class="reset" type="button">重置</button></div></section>
      <section class="option"><div class="option-head"><span class="option-index">B</span><h2>横向推入</h2><p>详情从右侧进入，与当前左右返回的空间方向一致 · 约 380 ms</p></div><div class="demo push" data-variant="push"></div><div class="controls"><button class="replay" type="button">播放动画</button><button class="reset" type="button">重置</button></div></section>
      <section class="option"><div class="option-head"><span class="option-index">C</span><h2>底部上浮</h2><p>像打开一张新卡片，节奏轻快、层次明确 · 约 440 ms</p></div><div class="demo lift" data-variant="lift"></div><div class="controls"><button class="replay" type="button">播放动画</button><button class="reset" type="button">重置</button></div></section>
    </div>
    <p class="note">动画只用于比较进入详情时的动势；页面比例、内容和现有 Android 应用可以在选定方案后再精确对齐。</p>
  </div>
  <template id="screen-template">
    <div class="status"><span>9:41</span><span>●●●  ▰</span></div>
    <div class="home">
      <div class="home-head"><span class="avatar">●</span><span class="search"><span class="search-mark"></span>搜索剧名或 #标签</span></div>
      <p class="featured">精选推荐</p>
      <button class="home-card" type="button" aria-label="打开暮色来信详情"><div class="art"><span class="art-kicker">黄果原创 · 全新上线</span><strong class="art-title">暮色<br>来信</strong><span class="art-mark">HUANGGUO · 2026</span></div><div class="home-card-meta"><strong>暮色来信</strong><span>9.2 分 · 更新至 8 集</span></div></button>
      <p class="home-sub">最近上新</p><div class="mini-row"><div class="mini-poster"></div><div class="mini-poster"></div><div class="mini-poster"></div></div>
    </div>
    <div class="detail" inert>
      <div class="detail-hero"><div class="art"><span class="art-kicker">黄果原创 · 全新上线</span><strong class="art-title">暮色<br>来信</strong><span class="art-mark">HUANGGUO · 2026</span></div></div>
      <button class="detail-back" type="button">‹　返回</button>
      <div class="detail-copy"><h3>暮色来信</h3><p class="meta">9.2 分　共 8 集</p><p class="synopsis">一封迟到多年的信，把曾经错过的人重新带回这座城市。夜色将尽，他们终于决定把未说出口的话讲完。</p><button class="detail-play" type="button">立即播放</button><div class="episode-title">选集</div><div class="episodes"><span>1</span><span>2</span><span>3</span><span>4</span></div></div>
    </div>
    <div class="dock"><b>⌂</b><span>剧场</span><span>AI</span><span>我的</span></div>
  </template>
  <script>
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
    const template = document.getElementById('screen-template');
    for (const demo of document.querySelectorAll('.demo')) {
      demo.appendChild(template.content.cloneNode(true));
      demo.querySelector('.home-card').addEventListener('click', () => play(demo));
      demo.querySelector('.detail-back').addEventListener('click', () => reset(demo));
      const option = demo.closest('.option');
      option.querySelector('.replay').addEventListener('click', () => replay(demo));
      option.querySelector('.reset').addEventListener('click', () => reset(demo));
    }
    document.getElementById('play-all').addEventListener('click', () => document.querySelectorAll('.demo').forEach(replay));

    function reset(demo) {
      demo._animationToken = (demo._animationToken || 0) + 1;
      demo._animation?.cancel();
      demo._animation = null;
      demo.querySelector('.ghost')?.remove();
      demo.classList.remove('is-open', 'is-opening');
      demo.querySelector('.detail').inert = true;
      demo.closest('.option').querySelector('.replay').textContent = '播放动画';
    }
    function replay(demo) {
      reset(demo);
      requestAnimationFrame(() => requestAnimationFrame(() => play(demo)));
    }
    function play(demo) {
      if (demo.classList.contains('is-open') || demo.classList.contains('is-opening')) return;
      demo.querySelector('.detail').inert = false;
      demo.closest('.option').querySelector('.replay').textContent = '再看一遍';
      if (demo.dataset.variant !== 'shared' || reduceMotion.matches) {
        demo.classList.add('is-open');
        return;
      }
      const source = demo.querySelector('.home-card .art');
      const target = demo.querySelector('.detail-hero .art');
      const parent = demo.getBoundingClientRect();
      const from = source.getBoundingClientRect();
      const to = target.getBoundingClientRect();
      const ghost = source.cloneNode(true);
      ghost.classList.add('ghost');
      Object.assign(ghost.style, {left:`${to.left-parent.left}px`,top:`${to.top-parent.top}px`,width:`${to.width}px`,height:`${to.height}px`});
      demo.appendChild(ghost);
      demo.classList.add('is-opening');
      const dx = from.left-to.left, dy = from.top-to.top;
      demo._animation = ghost.animate([
        {transform:`translate(${dx}px,${dy}px) scale(${from.width/to.width},${from.height/to.height})`,borderRadius:'16px'},
        {transform:'translate(0,0) scale(1)',borderRadius:'0px'}
      ],{duration:500,easing:'cubic-bezier(.16,1,.3,1)',fill:'forwards'});
      const token = demo._animationToken;
      const finish = () => {
        if (demo._animationToken !== token || !demo.classList.contains('is-opening')) return;
        demo.classList.remove('is-opening');
        demo.classList.add('is-open');
        ghost.remove();
        demo._animation = null;
      };
      demo._animation.onfinish = finish;
      setTimeout(finish, 540);
    }
    if (new URLSearchParams(location.search).has('autoplay'))
      setTimeout(() => document.getElementById('play-all').click(), 200);
  </script>
</body>
</html>
